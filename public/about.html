<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关于</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      background: #1a1d23;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #f3f5f7;
    }
    .about-container {
      text-align: center;
      padding: 32px;
      max-width: 360px;
    }
    .mark {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: #23272d;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark span {
      width: 12px;
      height: 12px;
      border-radius: 3.5px;
      background: #48d3a4;
      transform: rotate(45deg);
    }
    .app-name {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.01em;
      margin-bottom: 14px;
      color: #f3f5f7;
    }
    .info-row {
      font-size: 12.5px;
      line-height: 2.1;
      color: #7d8690;
      font-family: "Cascadia Mono", Consolas, monospace;
    }
    .info-row b { color: #c3cad2; font-weight: 500; }
    .info-label { margin-right: 10px; }
    .close-btn {
      margin-top: 22px;
      padding: 7px 26px;
      font-size: 13px;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      color: #f3f5f7;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .close-btn:hover { background: rgba(255, 255, 255, 0.12); }
    .close-btn:focus-visible { outline: 2px solid #48d3a4; outline-offset: 2px; }
    .error { color: #ff6b6b; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="about-container">
    <div class="mark"><span></span></div>
    <div class="app-name" id="appName">my-tools</div>
    <div class="info-row"><span class="info-label">版本</span><b id="appVersion">加载中...</b></div>
    <div class="info-row"><span class="info-label">作者</span><b id="appAuthor">加载中...</b></div>
    <div id="errorMsg" class="error" style="display:none;"></div>
    <button class="close-btn" id="closeBtn">关闭</button>
  </div>
  <script>
    function closeWindow() {
      // 优先调用 Rust 命令关闭窗口，避免不同 Tauri 版本前端 API 差异导致“关闭”按钮失效。
      const tauriCore = window.__TAURI__ && window.__TAURI__.core;
      if (tauriCore && tauriCore.invoke) {
        tauriCore.invoke('hide_about_cmd').catch(function(err) {
          console.error('hide_about_cmd failed:', err);
          fallbackCloseWindow();
        });
        return;
      }
      fallbackCloseWindow();
    }

    function fallbackCloseWindow() {
      const tauriApi = window.__TAURI__;
      if (!tauriApi) {
        return;
      }
      if (tauriApi.webviewWindow && tauriApi.webviewWindow.getCurrentWebviewWindow) {
        tauriApi.webviewWindow.getCurrentWebviewWindow().hide();
        return;
      }
      if (tauriApi.window && tauriApi.window.getCurrentWindow) {
        tauriApi.window.getCurrentWindow().hide();
      }
    }

    document.getElementById('closeBtn').addEventListener('click', closeWindow);

    (function() {
      const tauriCore = window.__TAURI__ && window.__TAURI__.core;
      if (!tauriCore) {
        showError('Tauri API 不可用，请确保在 Tauri 窗口中打开此页面');
        return;
      }

      const { invoke } = tauriCore;
      invoke('get_about_info')
        .then(function(info) {
          console.log('get_about_info result:', info);
          document.getElementById('appName').textContent = info.name || 'my-tools';
          document.getElementById('appVersion').textContent = info.version || '未知';
          document.getElementById('appAuthor').textContent = info.author || '未知';
        })
        .catch(function(err) {
          console.error('get_about_info failed:', err);
          showError('获取信息失败: ' + (err.message || JSON.stringify(err)));
          document.getElementById('appVersion').textContent = '获取失败';
          document.getElementById('appAuthor').textContent = '获取失败';
        });
    })();

    function showError(msg) {
      var el = document.getElementById('errorMsg');
      el.style.display = 'block';
      el.textContent = msg;
    }
  </script>
</body>
</html>
